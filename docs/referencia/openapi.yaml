  /api/empresas:
    get:
      tags: [Empresas]
      summary: Listar empresas
      description: Todas as prefeituras clientes, em ordem de nome.
      operationId: listarEmpresas
      security:
        - token: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Empresa'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemAcesso'
    post:
      tags: [Empresas]
      summary: Cadastrar empresa
      description: |
        Cria o tenant `<subdominio com _ no lugar de ->`, o domínio `<subdominio>.<primeiro CENTRAL_DOMAINS>`
        e, em fila, o banco `stm_tenant_<id>` com as migrations e os grupos de acesso.
        A empresa volta com `situacao: provisionando` até o banco ficar pronto.
      operationId: cadastrarEmpresa
      security:
        - token: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, cnpj, subdominio, administrador]
              properties:
                nome:
                  type: string
                  maxLength: 150
                  examples: [Prefeitura de Nova Esperança]
                cnpj:
                  type: string
                  description: Numérico ou alfanumérico, com ou sem máscara. Dígitos verificadores conferidos; único.
                  examples: ['11.222.333/0001-81', '12.ABC.345/01DE-35']
                subdominio:
                  type: string
                  maxLength: 40
                  pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
                  description: Não pode ser reservado (www, api, admin, app, mail, stm) nem estar em uso.
                  examples: [nova-esperanca]
                administrador:
                  type: object
                  description: |
                    Primeiro usuário da prefeitura, criado como `admin_<subdominio>` e colocado no
                    grupo Administrador (acesso a todas as telas). Se o CPF já existir no STM,
                    o usuário existente é aproveitado, mantendo nome e senha.
                  required: [cpf, email, senha]
                  properties:
                    cpf:
                      type: string
                      examples: ['529.982.247-25']
                    email:
                      type: string
                      format: email
                    senha:
                      type: string
                      format: password
                      minLength: 8
      responses:
        '201':
          description: Empresa cadastrada; provisionamento em andamento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empresa'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemAcesso'
        '422':
          description: Dados inválidos, CNPJ ou endereço já usados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDeValidacao'
              example:
                message: Este endereço já está em uso.
                errors:
                  subdominio: [Este endereço já está em uso.]
components:
  securitySchemes:
    token:
      type: http
      scheme: bearer
      description: Token do Laravel Sanctum
  schemas:
    Usuario:
      type: object
      required: [id, name, cpf, email, superadmin, grupos, permissoes, prefeituras]
      properties:
        id:
          type: integer
          examples: [1]
        name:
          type: string
          examples: [Administrador]
        cpf:
          type: [string, 'null']
          description: Só dígitos. `null` em usuários antigos ainda sem CPF (não conseguem entrar).
          examples: ['52998224725']
        email:
          type: string
          format: email
          examples: [admin@stm.localhost]
        foto:
          type: [string, 'null']
          description: Endereço da foto (`/api/fotos/...`).
        superadmin:
          type: boolean
          description: Superadmin com efeito nesta prefeitura (só na prefeitura administradora).
        grupos:
          type: array
          description: Grupos de acesso do usuário nesta prefeitura.
          items:
            type: string
          examples: [[Parâmetros, Tabelas]]
        permissoes:
          type: array
          description: |
            Permissões nesta prefeitura, uma por tela (`/parametros/receitas` → `parametros.receitas`).
            O superadmin recebe todas, mais `administracao.empresas`.
          items:
            type: string
          examples: [[parametros.receitas, parametros.iptu]]
        prefeituras:
          type: array
          description: Prefeituras a que o usuário tem acesso, para o seletor de prefeitura.
          items:
            type: object
            required: [id, nome, dominio]
            properties:
              id:
                type: string
                examples: [lemarq]
              nome:
                type: [string, 'null']
                examples: [Lemarq]
              dominio:
                type: [string, 'null']
                examples: [lemarq.localhost]
    Grupo:
      type: object
      required: [id, nome, telas, usuarios, sistema]
      properties:
        id:
          type: integer
        nome:
          type: string
          examples: [Fiscalização]
        telas:
          type: array
          description: Uma permissão por tela (`/parametros/alvara` → `parametros.alvara`).
          items:
            type: string
        usuarios:
          type: integer
          description: Quantos usuários da prefeitura estão no grupo.
        sistema:
          type: boolean
          description: |
            Grupo do sistema (`Administrador`): tem todas as telas, acompanha o catálogo e
            não pode ser alterado nem excluído (`PUT` e `DELETE` respondem 422).
    DadosDoGrupo:
      type: object
      required: [nome]
      properties:
        nome:
          type: string
          maxLength: 60
        telas:
          type: array
          description: Telas do catálogo (`config/acesso.php`). `administracao.empresas` não é aceita.
          items:
            type: string
    UsuarioDaPrefeitura:
      type: object
      required: [id, name, cpf, email, superadmin, ativo, grupos, somente_grupos]
      properties:
        id:
          type: integer
        name:
          type: string
        cpf:
          type: [string, 'null']
          description: Só dígitos.
        email:
          type: string
          format: email
        superadmin:
          type: boolean
        ativo:
          type: boolean
          description: Acesso ativo nesta prefeitura. Desativado, o usuário não entra aqui.
        grupos:
          type: array
          items:
            type: string
        somente_grupos:
          type: boolean
          description: O usuário está em outra prefeitura também; aqui só os grupos podem mudar.
    Empresa:
      type: object
      required: [id, nome, cnpj, dominio, situacao, criada_em]
      properties:
        id:
          type: string
          description: Id do tenant; o banco é `stm_tenant_<id>`.
          examples: [nova_esperanca]
        nome:
          type: [string, 'null']
          examples: [Prefeitura de Nova Esperança]
        cnpj:
          type: [string, 'null']
          description: Sem máscara, em maiúsculas. `null` em prefeituras anteriores ao cadastro de empresas.
          examples: ['11222333000181']
        dominio:
          type: [string, 'null']
          examples: [nova-esperanca.localhost]
        situacao:
          type: string
          enum: [provisionando, ativa]
          description: '`provisionando` até o worker criar o banco, migrar e criar os grupos.'
        criada_em:
          type: [string, 'null']
          format: date-time
    ReceitasDosTributos:
      type: object
      description: Id da receita (`tb_receita`) de cada tributo, ou null. Coluna `id_receita_<tributo>`.
      properties:
        iss:
          type: [integer, 'null']
        taxa:
          type: [integer, 'null']
        tll:
          type: [integer, 'null']
        irpf:
          type: [integer, 'null']
        irpj:
          type: [integer, 'null']
        inss:
          type: [integer, 'null']
        itbi:
          type: [integer, 'null']
        habite:
          type: [integer, 'null']
        iptu:
          type: [integer, 'null']
        tcl:
          type: [integer, 'null']
        tcc:
          type: [integer, 'null']
        tip:
          type: [integer, 'null']
        tlp:
          type: [integer, 'null']
    ParametroReceita:
      type: object
      properties:
        receitas:
          $ref: '#/components/schemas/ReceitasDosTributos'
    Banco:
      type: object
      required: [id, codigo, nome]
      properties:
        id:
          type: integer
        codigo:
          type: string
          description: Código de compensação (4 dígitos, com os zeros à esquerda).
          examples: ['0001']
        nome:
          type: string
          examples: [Banco do Brasil S.A.]
    Cnae:
      type: object
      required: [id, nivel, codigo, secao, divisao, grupo, classe, subclasse, denominacao, versao, ativo]
      properties:
        id:
          type: integer
        nivel:
          type: string
          enum: [secao, divisao, grupo, classe, subclasse]
          description: Nível mais específico preenchido na linha.
        codigo:
          type: string
          description: Código do nível da linha.
          examples: ['8593-7/00', 'P']
        secao:
          type: string
          examples: [P]
        divisao:
          type: [string, 'null']
          examples: ['85']
        grupo:
          type: [string, 'null']
          examples: ['85.9']
        classe:
          type: [string, 'null']
          examples: [85.93-7]
        subclasse:
          type: [string, 'null']
          examples: [8593-7/00]
        denominacao:
          type: string
          examples: [Ensino de idiomas]
        versao:
          type: [string, 'null']
          examples: ['2.3']
        ativo:
          type: boolean
    ItemLcp116:
      type: object
      required: [codigo, tipo, descricao]
      properties:
        codigo:
          type: string
          examples: ['01.02']
        tipo:
          type: string
          enum: [item, subitem]
          description: '`item` quando o código tem 2 dígitos; `subitem` quando tem ponto.'
        descricao:
          type: string
          examples: [Programação.]
    Selic:
      type: object
      required: [id, ano, mes, valor]
      properties:
        id:
          type: integer
        ano:
          type: integer
          examples: [2026]
        mes:
          type: integer
          minimum: 1
          maximum: 12
        valor:
          type: [string, 'null']
          description: Taxa do mês, em texto com 2 casas para não perder precisão.
          examples: ['1.16']
    Segmento:
      type: object
      required: [codigo, descricao]
      properties:
        codigo:
          type: string
          description: Um dígito, usado no código de barras de arrecadação.
          examples: ['1']
        descricao:
          type: string
          maxLength: 50
          examples: [PREFEITURA]
    NotaNumeracao:
      type: object
      required: [codigo, descricao]
      properties:
        codigo:
          type: string
          description: Uma letra, gravada em `tb_parametro_nota_fiscal.tipo_numeracao`.
          examples: [A]
        descricao:
          type: string
          examples: [AUTOMÁTICO]
    DamTipo:
      type: object
      required: [codigo, descricao]
      properties:
        codigo:
          type: integer
          examples: [3]
        descricao:
          type: string
          examples: [IPTU]
    Cidade:
      type: object
      required: [id, codigo_ibge, nome, uf]
      properties:
        id:
          type: integer
        codigo_ibge:
          type: string
          description: Código do município no IBGE (7 dígitos).
          examples: ['3550308']
        nome:
          type: string
          examples: [São Paulo]
        uf:
          type: string
          examples: [SP]
    ErroDeValidacao:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    Mensagem:
      type: object
      required: [message]
      properties:
        message:
          type: string
  responses:
    PrefeituraNaoEncontrada:
      description: O domínio não pertence a nenhuma prefeitura
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Mensagem'
          example:
            message: Prefeitura não encontrada.
    NaoAutenticado:
      description: Token ausente, inválido ou revogado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Mensagem'
          example:
            message: Unauthenticated.
    SemAcesso:
      description: Usuário sem vínculo com esta prefeitura, ou sem permissão para a rota
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Mensagem'
          example:
            message: Sem acesso a esta prefeitura.
