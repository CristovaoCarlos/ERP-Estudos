openapi: 3.1.0
info:
  title: STM API
  version: 0.1.0
  summary: API do Sistema de Tributação Municipal
  description: |
    API JSON consumida pelo frontend do STM.

    **Prefeitura (tenant):** as rotas de prefeitura são identificadas pelo header `Host`.
    A mesma rota `/api/login` em `lemarq.localhost` e em `prefeitura-teste.localhost`
    atende prefeituras diferentes, com bancos diferentes.

    **Autenticação:** token Bearer obtido em `POST /api/login`.

    **Erros de validação** seguem o formato padrão do Laravel (`422` com `message` e `errors`).
servers:
  - url: 'http://{prefeitura}.localhost:8000'
    description: Prefeitura em desenvolvimento (nginx do Docker)
    variables:
      prefeitura:
        default: lemarq
        description: Subdomínio da prefeitura
  - url: 'http://localhost:8000'
    description: Domínio central em desenvolvimento
tags:
  - name: Central
    description: Rotas dos domínios centrais (`CENTRAL_DOMAINS`)
  - name: Prefeitura
    description: Rotas que identificam a prefeitura pelo domínio
  - name: Autenticação
    description: Login, usuário atual e logout (por prefeitura)
  - name: Senha
    description: Recuperação de senha por e-mail (sem autenticação)
  - name: Usuários
    description: Usuários da prefeitura (permissão `administracao.usuarios`)
  - name: Grupos de acesso
    description: Grupos da prefeitura e as telas de cada um
  - name: Parâmetros
    description: Parâmetros da prefeitura (permissão da tela, ex. `parametros.receitas`)
  - name: Tabelas Comuns
    description: Tabelas de apoio do banco central, iguais para todas as prefeituras
  - name: Empresas
    description: Prefeituras clientes. Só o superadmin, na prefeitura administradora (`TENANT_ADMINISTRADOR`)
paths:
  /up:
    get:
      tags: [Central]
      summary: Verificação de saúde
      operationId: saude
      security: []
      responses:
        '200':
          description: Aplicação no ar
  /api/status:
    get:
      tags: [Central]
      summary: Status da aplicação
      description: Disponível apenas nos domínios centrais.
      operationId: status
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [app, status]
                properties:
                  app:
                    type: string
                    examples: [STM]
                  status:
                    type: string
                    examples: [ok]
  /api/tenant:
    get:
      tags: [Prefeitura]
      summary: Prefeitura atual
      description: Retorna o id e o nome da prefeitura identificada pelo domínio.
      operationId: tenantAtual
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [id, nome]
                properties:
                  id:
                    type: string
                    examples: [lemarq]
                  nome:
                    type: [string, 'null']
                    description: Nome cadastrado em Administração › Empresas.
                    examples: [Lemarq]
        '404':
          $ref: '#/components/responses/PrefeituraNaoEncontrada'
  /api/login:
    post:
      tags: [Autenticação]
      summary: Entrar
      description: |
        Confere CPF, senha e o vínculo do usuário com a prefeitura do domínio.
        Limite: 5 tentativas por minuto por CPF + IP.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cpf, password]
              properties:
                cpf:
                  type: string
                  description: CPF com ou sem máscara. Os dígitos verificadores são conferidos.
                  examples: ['529.982.247-25', '52998224725']
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login feito
          content:
            application/json:
              schema:
                type: object
                required: [token, usuario]
                properties:
                  token:
                    type: string
                    description: 'Token para o header `Authorization: Bearer`'
                    examples: ['3|kX9…']
                  usuario:
                    $ref: '#/components/schemas/Usuario'
        '422':
          description: Dados inválidos, senha errada ou usuário sem acesso à prefeitura
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDeValidacao'
              example:
                message: CPF ou senha inválidos.
                errors:
                  cpf: [CPF ou senha inválidos.]
        '429':
          description: Muitas tentativas
  /api/senha/esqueci:
    post:
      tags: [Senha]
      summary: Pedir o link de redefinição
      description: |
        Envia ao e-mail do usuário um link para redefinir a senha, apontando para o endereço da
        prefeitura em que o pedido foi feito. A resposta é sempre a mesma, exista ou não o CPF,
        para não revelar quem está cadastrado. Nada é enviado se o acesso do usuário à prefeitura
        estiver desativado. Limite: 5 pedidos por minuto por CPF + IP.
      operationId: esqueciSenha
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cpf]
              properties:
                cpf:
                  type: string
                  examples: ['529.982.247-25']
      responses:
        '200':
          description: Pedido recebido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              example:
                message: Se o CPF estiver cadastrado nesta prefeitura, enviamos um e-mail com o link para redefinir a senha.
        '422':
          description: CPF inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDeValidacao'
        '429':
          description: Muitos pedidos
  /api/senha/redefinir:
    post:
      tags: [Senha]
      summary: Redefinir a senha
      description: |
        Usa o token do e-mail, que vale 60 minutos e só serve uma vez. Ao trocar a senha, todos os
        tokens de acesso do usuário são revogados, em todas as prefeituras.
      operationId: redefinirSenha
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cpf, token, password, password_confirmation]
              properties:
                cpf:
                  type: string
                token:
                  type: string
                password:
                  type: string
                  format: password
                  minLength: 8
                password_confirmation:
                  type: string
                  format: password
      responses:
        '200':
          description: Senha alterada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              example:
                message: Senha alterada. Entre com a senha nova.
        '422':
          description: Link inválido ou expirado, ou senha fraca
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDeValidacao'
              example:
                message: Link inválido ou expirado. Peça um novo.
                errors:
                  token: [Link inválido ou expirado. Peça um novo.]
        '429':
          description: Muitas tentativas
  /api/me:
    get:
      tags: [Autenticação]
      summary: Usuário atual
      operationId: usuarioAtual
      security:
        - token: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemAcesso'
  /api/me/foto:
    post:
      tags: [Autenticação]
      summary: Enviar a foto do usuário
      description: |
        `multipart/form-data` com o campo `foto`: JPEG, PNG ou WebP, até 2 MB e 4000×4000.
        Substitui e apaga a foto anterior. A foto é do usuário e aparece em todas as prefeituras.
      operationId: enviarFoto
      security:
        - token: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [foto]
              properties:
                foto:
                  type: string
                  format: binary
      responses:
        '200':
          description: Foto atualizada
          content:
            application/json:
              schema:
                type: object
                required: [foto]
                properties:
                  foto:
                    type: string
                    examples: ['/api/fotos/Xq15ZGSD1MlIQsHBOd3GrQ1VGH5I50YQSAL4oS53.png']
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '422':
          description: Arquivo grande demais ou fora dos formatos aceitos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDeValidacao'
    delete:
      tags: [Autenticação]
      summary: Remover a foto do usuário
      operationId: removerFoto
      security:
        - token: []
      responses:
        '200':
          description: Foto removida
          content:
            application/json:
              schema:
                type: object
                properties:
                  foto:
                    type: 'null'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
  '/api/fotos/{arquivo}':
    get:
      tags: [Autenticação]
      summary: Ver a foto de um usuário
      description: |
        Sem autenticação: o nome aleatório do arquivo (40 caracteres) é a credencial.
        A pasta `public` servida pelo nginx não enxerga o storage, por isso a foto sai por aqui.
      operationId: verFoto
      security: []
      parameters:
        - name: arquivo
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Imagem
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          description: Nome inválido ou arquivo inexistente
  /api/me/senha:
    put:
      tags: [Autenticação]
      summary: Trocar a própria senha
      description: Confere a senha atual. As outras sessões do usuário são encerradas; a que trocou continua.
      operationId: trocarPropriaSenha
      security:
        - token: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [senha_atual, password, password_confirmation]
              properties:
                senha_atual:
                  type: string
                  format: password
                password:
                  type: string
                  format: password
                  minLength: 8
                password_confirmation:
                  type: string
                  format: password
      responses:
        '200':
          description: Senha alterada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemAcesso'
        '422':
          description: Senha atual incorreta ou nova senha inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDeValidacao'
  /api/logout:
    post:
      tags: [Autenticação]
      summary: Sair
      description: Revoga o token usado na requisição.
      operationId: logout
      security:
        - token: []
      responses:
        '204':
          description: Token revogado
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemAcesso'
  /api/usuarios:
    get:
      tags: [Usuários]
      summary: Listar usuários da prefeitura
      operationId: listarUsuarios
      security:
        - token: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UsuarioDaPrefeitura'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemAcesso'
    post:
      tags: [Usuários]
      summary: Cadastrar ou vincular usuário
      description: |
        Cria o usuário no banco central e o vincula à prefeitura do domínio.
        Se o CPF já existir no STM, **vincula o usuário existente** (mantendo nome e senha) e
        responde com `vinculado: true`.
      operationId: cadastrarUsuario
      security:
        - token: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, cpf, email, password]
              properties:
                name:
                  type: string
                  maxLength: 150
                cpf:
                  type: string
                  description: Com ou sem máscara; dígitos verificadores conferidos.
                  examples: ['529.982.247-25']
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  minLength: 8
                grupos:
                  type: array
                  description: Grupos de acesso desta prefeitura (`GET /api/grupos`).
                  items:
                    type: string
      responses:
        '201':
          description: Usuário cadastrado ou vinculado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/UsuarioDaPrefeitura'
                  - type: object
                    required: [vinculado]
                    properties:
                      vinculado:
                        type: boolean
                        description: O usuário já existia no STM e só ganhou acesso a esta prefeitura.
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemAcesso'
        '422':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDeValidacao'
  '/api/usuarios/{id}':
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    put:
      tags: [Usuários]
      summary: Alterar dados do usuário
      description: |
        Altera nome, e-mail e senha; senha em branco mantém a atual. **Não mexe nos grupos**
        (use `PUT /api/usuarios/{id}/vinculos`). Se o usuário também estiver em outra prefeitura,
        nada muda aqui: nome, e-mail e senha são dele, não desta prefeitura.
      operationId: alterarUsuario
      security:
        - token: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name:
                  type: string
                  maxLength: 150
                email:
                  type: string
                  format: email
                password:
                  type: [string, 'null']
                  format: password
                  minLength: 8
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioDaPrefeitura'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemAcesso'
        '404':
          description: O usuário não tem acesso a esta prefeitura
        '422':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDeValidacao'
    delete:
      tags: [Usuários]
      summary: Tirar o acesso do usuário à prefeitura
      description: |
        Remove o vínculo, os grupos e os tokens do usuário **nesta** prefeitura.
        O cadastro continua no STM. Ninguém pode remover o próprio acesso.
      operationId: removerUsuario
      security:
        - token: []
      responses:
        '204':
          description: Acesso removido
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemAcesso'
        '404':
          description: O usuário não tem acesso a esta prefeitura
        '422':
          description: Tentativa de remover o próprio acesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDeValidacao'
  '/api/usuarios/{id}/vinculos':
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    put:
      tags: [Usuários]
      summary: Definir os grupos do usuário na prefeitura
      description: A lista substitui os grupos atuais; vazia, o usuário fica só com o Início.
      operationId: alterarVinculosDoUsuario
      security:
        - token: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grupos]
              properties:
                grupos:
                  type: array
                  items:
                    type: string
                  examples: [[Parâmetros, Tabelas]]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioDaPrefeitura'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemAcesso'
        '404':
          description: O usuário não tem vínculo com esta prefeitura
        '422':
          description: Grupo inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDeValidacao'
  '/api/usuarios/{id}/status':
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    put:
      tags: [Usuários]
      summary: Ativar ou desativar o acesso do usuário
      description: |
        O status vale **só nesta prefeitura**: desativado aqui, o usuário continua trabalhando nas
        outras. Desativar encerra as sessões dele nesta prefeitura; o login passa a responder
        "Seu acesso a esta prefeitura está desativado.". O cadastro e os grupos são mantidos.
        Ninguém pode desativar o próprio acesso.
      operationId: alterarStatusDoUsuario
      security:
        - token: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ativo]
              properties:
                ativo:
                  type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioDaPrefeitura'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemAcesso'
        '404':
          description: O usuário não tem vínculo com esta prefeitura
        '422':
          description: Tentativa de desativar o próprio acesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDeValidacao'
  /api/grupos:
    get:
      tags: [Grupos de acesso]
      summary: Listar grupos da prefeitura
      description: Aceita `administracao.grupos` **ou** `administracao.usuarios` (o formulário de usuários usa esta lista).
      operationId: listarGrupos
      security:
        - token: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Grupo'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemAcesso'
    post:
      tags: [Grupos de acesso]
      summary: Criar grupo
      operationId: criarGrupo
      security:
        - token: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DadosDoGrupo'
      responses:
        '201':
          description: Grupo criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grupo'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemAcesso'
        '422':
          description: Nome repetido ou tela desconhecida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDeValidacao'
  '/api/grupos/{id}':
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    put:
      tags: [Grupos de acesso]
      summary: Alterar grupo
      description: As telas informadas substituem as atuais. Os usuários do grupo passam a enxergar as novas telas.
      operationId: alterarGrupo
      security:
        - token: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DadosDoGrupo'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grupo'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemAcesso'
        '422':
          description: Nome repetido ou tela desconhecida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDeValidacao'
    delete:
      tags: [Grupos de acesso]
      summary: Excluir grupo
      description: |
        Recusa se algum usuário estiver no grupo, e sempre para o grupo `Administrador`.
        Grupos padrão excluídos voltam no próximo `acesso:sincronizar`.
      operationId: excluirGrupo
      security:
        - token: []
      responses:
        '204':
          description: Grupo excluído
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemAcesso'
        '422':
          description: Grupo em uso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDeValidacao'
  /api/parametros/receitas:
    get:
      tags: [Parâmetros]
      summary: Receitas dos tributos da prefeitura
      description: Um registro só por prefeitura. Sem nada gravado, todos os tributos vêm `null`.
      operationId: verParametroReceita
      security:
        - token: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParametroReceita'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemAcesso'
    put:
      tags: [Parâmetros]
      summary: Gravar as receitas dos tributos
      description: Cria o registro na primeira vez e responde 200 nos dois casos. Tributo ausente em `receitas` fica sem receita.
      operationId: gravarParametroReceita
      security:
        - token: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParametroReceita'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParametroReceita'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemAcesso'
        '422':
          description: Receita inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDeValidacao'
  /api/parametros/receitas/opcoes:
    get:
      tags: [Parâmetros]
      summary: Receitas para o formulário
      operationId: opcoesParametroReceita
      security:
        - token: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [receitas]
                properties:
                  receitas:
                    type: array
                    items:
                      type: object
                      required: [id, descricao, sigla]
                      properties:
                        id:
                          type: integer
                        descricao:
                          type: string
                        sigla:
                          type: [string, 'null']
        '401':
